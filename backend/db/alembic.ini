# Alembic 설정. 실행 진입점은 run_migration.sh 입니다.
# DB URL 은 이 파일에 두지 않고 환경변수(MIGRATION_DATABASE_URL)로 주입합니다.
[alembic]
script_location = .
version_locations = %(here)s/versions
prepend_sys_path = %(here)s/../src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
